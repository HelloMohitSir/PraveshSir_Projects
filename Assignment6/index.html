<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery App</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
        text-align: center;
        margin: 0;
      }

      h1 {
        padding: 20px;
      }

      .search-box {
        margin-bottom: 20px;
      }

      input {
        padding: 10px;
        width: 250px;
        border: none;
        border-radius: 5px;
      }

      button {
        padding: 10px 15px;
        border: none;
        background: #ff4b2b;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #ff3a1a;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
        padding: 20px;
      }

      .gallery img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 10px;
        transition: 0.3s;
      }

      .gallery img:hover {
        transform: scale(1.05);
      }

      #loadMore {
        margin: 20px;
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>📸 Image Gallery App</h1>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search images..." />
      <button onclick="searchImages()">Search</button>
    </div>
    <div class="gallery" id="gallery"></div>
    <button id="loadMore" onclick="loadMore()">Load More</button>

    <script>
      const accessKey = "CiyoYUHTegTgcQWUIAhwNpPVibo4SttbRYsZ5wew7LA";
      let page = 1;
      let currentQuery = "";

      async function searchImages() {
        const query = document.getElementById("searchInput").value;
        if (!query) return;

        currentQuery = query;
        page = 1;
        document.getElementById("gallery").innerHTML = "";

        fetchImages();
      }

      async function fetchImages() {
        const url = `https://api.unsplash.com/search/photos?page=${page}&query=${currentQuery}&client_id=${accessKey}`;

        const response = await fetch(url);
        const data = await response.json();

        displayImages(data.results);

        document.getElementById("loadMore").style.display = "block";
      }

      function displayImages(images) {
        const gallery = document.getElementById("gallery");

        images.forEach((img) => {
          const imageElement = document.createElement("img");
          imageElement.src = img.urls.small;
          gallery.appendChild(imageElement);
        });
      }

      function loadMore() {
        page++;
        fetchImages();
      }
    </script>
  </body>
</html>
